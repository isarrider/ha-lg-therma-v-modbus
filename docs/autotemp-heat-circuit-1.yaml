# AutoTemp_Heat_Circuit_1: once the compressor runs, inlet control and the
# circuit 1 setpoint straight to a target from the outdoor temperature, so the
# unit heats at the max compressor modulation until the water is there and then
# holds it on its own. Throttles only for real ice on the coil, not for a cold
# coil. Explained in docs/automations.md; why in docs/cop-efficiency.md and
# docs/findings.md ("A cold coil is not yet ice"). Paste it in Settings →
# Automations & scenes → Create automation → ⋮ → Edit in YAML.
#
# Written for a 12 kW unit with the thermo on/off hysteresis for heating water
# ("Th On/Off Variable, Heating Water" in the installer menu of the remote) at
# ±4 °C: emergency_gap (3) and frost_max_gap (2.5) keep a margin to it; with a
# smaller hysteresis, lower them.
#
# Frost protection reads temperature and humidity from weather_entity
# (weather.forecast_home is the default of the Met.no integration); without
# them it works on the coil and the gap alone.
#
# Every change of the setpoint is explained in one logbook line next to it
# ("AutoTemp back up to 37 °C (target 37 °C, coil -1.4 °C, 3.9 K below
# outdoor)"); a logbook card for the setpoint shows them (docs/automations.md,
# "On the dashboard").
alias: AutoTemp_Heat_Circuit_1
description: >
  Until 17:00, while the compressor runs, not within 5 minutes after a defrost,
  and only while the setpoint is above off_setpoint (setting the slider to
  off_setpoint or lower, by hand or by the stop automation, means off: AutoTemp
  then does nothing). Target: once the compressor has run 1 minute (the warm-up
  of the start automation on outlet control), switch to inlet control and set
  the circuit 1 setpoint to the target right away (target_cold at outdoor_cold,
  target_warm at outdoor_warm, linear in between), so the unit heats at the max
  compressor modulation until the water gets there and then holds it on its
  own. Frost protection: when the coil is icing up, i.e. it is below
  frost_coil, below the frost point of the air (from the temperature and
  humidity of the weather entity: dry air does not ice even with the coil
  below 0 °C) and more than frost_gap colder than the outdoor air (normal while
  running is 3-4 K; ice on the fins blocks the air and pushes the gap up), set
  the setpoint just below the inlet so the unit throttles at once, then lower
  it every 2 minutes, keeping a safe gap to thermo off; straight back to the
  target once the gap is below frost_release_gap or the coil above frost_coil
  or the frost point (the max compressor modulation caps the speed, and the
  frost check catches new ice within 2 minutes). Without humidity data the frost point
  check is skipped (gap and coil only). A cold coil alone does not throttle: below about 3 °C
  outside it is always below 0 °C while heating. Thermo off
  guard: when the inlet is emergency_gap above the setpoint (the house takes
  less than the compressor's minimum), raise it by step up to ceiling; lower it
  again, never below the target, once the inlet is down_gap below it for 5
  minutes. Oil boost: after 55 minutes below low_rpm, set the setpoint to the
  inlet temperature + boost_step (up to boost_ceiling) until the compressor has
  been at or above low_rpm for boost_hold_sec (at most boost_wait_min), then
  back to the setpoint from before the boost. Re-checks every 5 minutes. The
  unit's lowest heating setpoint is 20 °C (with the backup heater off), hence
  off_setpoint 20.
trigger_variables:
  # Entities
  inlet_entity: sensor.lg_therma_v_r290_inlet_temperature
  setpoint_entity: number.lg_therma_v_r290_target_temperature_circuit_1_radiators
  evap_entity: sensor.lg_therma_v_r290_temperature_before_evaporator
  outdoor_entity: sensor.lg_therma_v_r290_outdoor_temperature
  weather_entity: weather.forecast_home   # temperature and humidity for the frost point
  speed_entity: sensor.lg_therma_v_r290_compressor_speed
  # Thresholds (used by the triggers and the conditions)
  emergency_gap: 3   # raise when inlet >= setpoint + emergency_gap: close to
                     # thermo off (setpoint + 4 with a ±4 °C hysteresis)
  down_gap: 1        # lower towards the target when inlet <= setpoint - down_gap for 5 minutes
  frost_coil: 0.5        # ice can only form while the coil is below this (°C)
  frost_gap: 5           # icing: outdoor - coil above this (K); normal 3-4 K
  frost_release_gap: 4   # back up once outdoor - coil is below this (K)
  low_rpm: 1500      # oil boost after 55 minutes below this compressor speed
  off_setpoint: 20   # setpoint at or below this = off, AutoTemp does nothing
triggers:
  - trigger: template
    id: up_emergency
    value_template: >
      {{ states(inlet_entity) | float(0) >= states(setpoint_entity) | float(999)
      + emergency_gap }}
    for:
      seconds: 20
  - trigger: template
    id: down
    value_template: >
      {{ states(inlet_entity) | float(999) <= states(setpoint_entity) | float(0)
      - down_gap }}
    for:
      minutes: 5
  - trigger: template
    id: frost
    value_template: |
      {%- set wt = state_attr(weather_entity, 'temperature') | float(none) -%}
      {%- set rh = state_attr(weather_entity, 'humidity') | float(none) -%}
      {%- if wt is number and rh is number and rh > 0 -%}
        {%- set g = log(rh / 100) + 22.46 * wt / (272.62 + wt) -%}
        {%- set fp = 272.62 * g / (22.46 - g) -%}
      {%- else -%}{%- set fp = 99 -%}{%- endif -%}
      {% set c = states(evap_entity) | float(99) %}
      {{ c < frost_coil and c < fp and states(outdoor_entity) | float(-99) - c > frost_gap }}
    for:
      minutes: 2
  - trigger: template
    id: frost_end
    value_template: |
      {%- set wt = state_attr(weather_entity, 'temperature') | float(none) -%}
      {%- set rh = state_attr(weather_entity, 'humidity') | float(none) -%}
      {%- if wt is number and rh is number and rh > 0 -%}
        {%- set g = log(rh / 100) + 22.46 * wt / (272.62 + wt) -%}
        {%- set fp = 272.62 * g / (22.46 - g) -%}
      {%- else -%}{%- set fp = 99 -%}{%- endif -%}
      {% set c = states(evap_entity) | float(-99) %}
      {{ c >= frost_coil or c >= fp or states(outdoor_entity) | float(99) - c < frost_release_gap }}
    for:
      minutes: 5
  # Oil boost: compressor running below low_rpm without a break for 55 minutes
  - trigger: template
    id: oil_boost
    value_template: |
      {{ is_state('binary_sensor.lg_therma_v_r290_compressor', 'on') and
         states(speed_entity) | float(9999) < low_rpm }}
    for:
      minutes: 55
  - trigger: state
    id: setpoint_2min
    entity_id: number.lg_therma_v_r290_target_temperature_circuit_1_radiators
    for:
      minutes: 2
  - trigger: state
    id: setpoint_5min
    entity_id: number.lg_therma_v_r290_target_temperature_circuit_1_radiators
    for:
      minutes: 5
  - trigger: state
    id: kick_in
    entity_id: binary_sensor.lg_therma_v_r290_compressor
    to: 'on'
    for:
      minutes: 1
  - trigger: state
    id: defrost_end
    entity_id: binary_sensor.lg_therma_v_r290_defrost
    to: 'off'
    for:
      minutes: 5
  # Re-check every 5 minutes: follows the target with the outdoor temperature,
  # and catches up after enabling the automation or a restart
  - trigger: time_pattern
    id: periodic
    minutes: /5
conditions:
  - condition: state
    entity_id: binary_sensor.lg_therma_v_r290_compressor
    state: 'on'
  - condition: time
    before: '17:00:00'
  - condition: state
    entity_id: binary_sensor.lg_therma_v_r290_defrost
    state: 'off'
    for:
      minutes: 5
  - condition: template
    value_template: '{{ inlet is number and setpoint is number }}'
  # Off: setpoint at or below off_setpoint (by hand or the stop automation)
  - condition: template
    value_template: '{{ setpoint > off_setpoint }}'
actions:
  - choose:
      # 1. Kick-in: outlet control (the start automation's warm-up), compressor
      #    on 1 minute -> inlet control first, then the target (lower while
      #    frosting; frost protection takes it from there)
      - conditions:
          - condition: state
            entity_id: select.lg_therma_v_r290_control_method
            state: Outlet Water Temp Control
          - condition: state
            entity_id: binary_sensor.lg_therma_v_r290_compressor
            state: 'on'
            for:
              minutes: 1
        sequence:
          - action: select.select_option
            target:
              entity_id: select.lg_therma_v_r290_control_method
            data:
              option: Inlet Water Temp Control
          - action: number.set_value
            target:
              entity_id: '{{ setpoint_entity }}'
            data:
              value: '{{ target }}'
          - action: logbook.log
            data:
              name: AutoTemp
              entity_id: '{{ setpoint_entity }}'
              message: >-
                target: inlet control, {{ target }} °C (outdoor {{ outdoor }} °C, inlet {{ inlet }} °C)
      # 2. Oil boost: 55 minutes below low_rpm -> inlet + boost_step, wait until
      #    the speed has been at or above low_rpm for boost_hold_sec, then back
      - conditions:
          - condition: trigger
            id: oil_boost
          - condition: state
            entity_id: select.lg_therma_v_r290_control_method
            state: Inlet Water Temp Control
          - condition: template
            value_template: '{{ not frosting and setpoint < boost_ceiling }}'
        sequence:
          - variables:
              before_boost: '{{ setpoint | int }}'
              boosted: >
                {{ [ [ (inlet | round(0, 'ceil')) + boost_step, setpoint + 1 ] | max,
                     boost_ceiling ] | min | int }}
          - action: number.set_value
            target:
              entity_id: '{{ setpoint_entity }}'
            data:
              value: '{{ boosted }}'
          - action: logbook.log
            data:
              name: AutoTemp
              entity_id: '{{ setpoint_entity }}'
              message: >-
                oil boost: {{ boosted }} °C after 55 min below {{ low_rpm }} rpm
          # Until the speed has been at or above low_rpm for boost_hold_sec
          # without a break, or the setpoint is set to off by hand
          - wait_for_trigger:
              - trigger: template
                value_template: '{{ states(speed_entity) | float(0) >= low_rpm }}'
                for:
                  seconds: '{{ boost_hold_sec }}'
              - trigger: template
                value_template: '{{ states(setpoint_entity) | float(999) <= off_setpoint }}'
            timeout:
              minutes: '{{ boost_wait_min }}'
            continue_on_timeout: true
          # Switched off during the boost -> leave the setpoint alone
          - condition: template
            value_template: '{{ states(setpoint_entity) | float(999) > off_setpoint }}'
          - action: number.set_value
            target:
              entity_id: '{{ setpoint_entity }}'
            data:
              value: '{{ before_boost }}'
          - action: logbook.log
            data:
              name: AutoTemp
              entity_id: '{{ setpoint_entity }}'
              message: >-
                oil boost over ({{ 'speed held' if wait.trigger else 'timed out' }}): back to {{ before_boost }} °C
      # 3. Thermo off guard: inlet emergency_gap above (also while frosting)
      - conditions:
          - condition: state
            entity_id: select.lg_therma_v_r290_control_method
            state: Inlet Water Temp Control
          - condition: template
            value_template: '{{ setpoint < ceiling and inlet >= setpoint + emergency_gap }}'
        sequence:
          - variables:
              raised: '{{ [ setpoint + step, ceiling ] | min | int }}'
          - action: number.set_value
            target:
              entity_id: '{{ setpoint_entity }}'
            data:
              value: '{{ raised }}'
          - action: logbook.log
            data:
              name: AutoTemp
              entity_id: '{{ setpoint_entity }}'
              message: >-
                raised to {{ raised }} °C: inlet {{ inlet }} °C, {{ (inlet - setpoint) | round(1) }} K above, close to thermo off
      # 4. Frost protection: first straight to just below the inlet (the unit
      #    throttles at once, also while heating up far below the target), then
      #    1 °C every 2 minutes, never more than frost_max_gap below the inlet
      - conditions:
          - condition: state
            entity_id: select.lg_therma_v_r290_control_method
            state: Inlet Water Temp Control
          - condition: trigger
            id:
              - frost
              - setpoint_2min
          - condition: template
            value_template: |
              {{ frosting and setpoint > floor and
                 inlet <= frost_sp + frost_max_gap }}
        sequence:
          - action: number.set_value
            target:
              entity_id: '{{ setpoint_entity }}'
            data:
              value: '{{ frost_sp }}'
          - action: logbook.log
            data:
              name: AutoTemp
              entity_id: '{{ setpoint_entity }}'
              message: >-
                frost protection: lowered to {{ frost_sp }} °C (coil {{ evap }} °C, {{ (outdoor - evap) | round(1) }} K below outdoor {{ outdoor }} °C, frost point {{ frost_point }} °C)
      # 5. Straight back to the target while not frosting (after frost
      #    protection, or when the target rose because it got colder outside).
      #    The max compressor modulation caps the speed; full speed only adds
      #    about 0.6 K to the outdoor-coil gap, and new ice is caught by the
      #    frost check within 2 minutes.
      - conditions:
          - condition: state
            entity_id: select.lg_therma_v_r290_control_method
            state: Inlet Water Temp Control
          - condition: trigger
            id:
              - frost_end
              - setpoint_5min
              - defrost_end
              - periodic
          - condition: template
            value_template: '{{ frost_clear and setpoint < target }}'
        sequence:
          - variables:
              back_up: '{{ target | int }}'
          - action: number.set_value
            target:
              entity_id: '{{ setpoint_entity }}'
            data:
              value: '{{ back_up }}'
          - action: logbook.log
            data:
              name: AutoTemp
              entity_id: '{{ setpoint_entity }}'
              message: >-
                back up to {{ back_up }} °C (target {{ target }} °C, coil {{ evap }} °C, {{ (outdoor - evap) | round(1) if outdoor is number and evap is number else '–' }} K below outdoor)
      # 6. Down towards the target: inlet down_gap below for 5 minutes, after
      #    the thermo off guard raised it or the target fell (milder outside)
      - conditions:
          - condition: state
            entity_id: select.lg_therma_v_r290_control_method
            state: Inlet Water Temp Control
          - condition: trigger
            id:
              - down
              - setpoint_5min
          - condition: template
            value_template: '{{ inlet <= setpoint - down_gap and setpoint > target }}'
        sequence:
          - variables:
              lowered: '{{ [ setpoint - step, target ] | max | int }}'
          - action: number.set_value
            target:
              entity_id: '{{ setpoint_entity }}'
            data:
              value: '{{ lowered }}'
          - action: logbook.log
            data:
              name: AutoTemp
              entity_id: '{{ setpoint_entity }}'
              message: >-
                lowered to {{ lowered }} °C: inlet {{ inlet }} °C, {{ (setpoint - inlet) | round(1) }} K below for 5 min (target {{ target }} °C)
mode: single
max_exceeded: silent
variables:
  step: 1                # °C per step
  ceiling: 40            # highest setpoint, except during the oil boost
  floor: 21              # lowest setpoint frost protection goes to
  frost_max_gap: 2.5     # frost lowering only while the inlet stays <= new setpoint + this
  # Oil boost
  boost_step: 3          # the boost sets the setpoint to inlet + boost_step
  boost_ceiling: 45      # boost limit, independent of ceiling
  boost_wait_min: 10     # at most this long for the whole boost
  boost_hold_sec: 60     # the speed must stay at or above low_rpm this long
  # Target: target_cold at outdoor_cold or colder, target_warm at outdoor_warm
  # or warmer, linear in between, rounded down to whole degrees
  target_cold: 37
  target_warm: 32
  outdoor_cold: 0
  outdoor_warm: 15
  inlet: '{{ states(inlet_entity) | float(none) }}'
  setpoint: '{{ states(setpoint_entity) | float(none) }}'
  evap: '{{ states(evap_entity) | float(none) }}'
  outdoor: '{{ states(outdoor_entity) | float(none) }}'
  # Icing: coil below frost_coil and more than frost_gap colder than the air.
  # Clear: gap below frost_release_gap or coil above frost_coil. In between
  # (4-5 K) neither, so the setpoint stays where it is.
  # Frost point of the air (Magnus over ice) from the weather entity's
  # temperature and relative humidity; 99 (no check) without data.
  frost_point: >
    {%- set wt = state_attr(weather_entity, 'temperature') | float(none) -%}
    {%- set rh = state_attr(weather_entity, 'humidity') | float(none) -%}
    {%- if wt is number and rh is number and rh > 0 -%}
      {%- set g = log(rh / 100) + 22.46 * wt / (272.62 + wt) -%}
      {{ (272.62 * g / (22.46 - g)) | round(1) }}
    {%- else -%}99{%- endif -%}
  frosting: >
    {{ evap is number and outdoor is number and evap < frost_coil
       and evap < frost_point and outdoor - evap > frost_gap }}
  frost_clear: >
    {{ evap is not number or outdoor is not number or evap >= frost_coil
       or evap >= frost_point or outdoor - evap < frost_release_gap }}
  frost_sp: >
    {{ [ [ setpoint | float(0) - step, inlet | float(0) | round(0, 'floor') ] | min,
         floor ] | max | int }}
  target: |
    {% if outdoor is number %}
      {% set f = (outdoor - outdoor_cold) / (outdoor_warm - outdoor_cold) %}
      {% set f = [ [ f, 0 ] | max, 1 ] | min %}
      {{ (target_cold + f * (target_warm - target_cold)) | round(0, 'floor') | int }}
    {% else %}
      {{ target_cold }}
    {% endif %}
