# AutoTemp status on a dashboard: what AutoTemp is doing now, and its last
# change. Needs the text helper input_text.autotemp_status (see
# docs/automations.md, "On the dashboard"). Paste it as a card: Edit
# dashboard → Add card → Manual. The logbook card in automations.md adds the
# history of the day.
type: markdown
text_only: true
grid_options:
  rows: auto
content: >-
  {% set sp = states('number.lg_therma_v_r290_target_temperature_circuit_1_radiators') | float(0) %}
  {% set defrost = states.binary_sensor.lg_therma_v_r290_defrost %}
  <ha-icon icon="mdi:robot-outline"></ha-icon> AutoTemp:
  {% if is_state('automation.autotemp_heat_circuit_1', 'off') -%}
  disabled
  {%- elif sp <= 20 -%}
  off (setpoint {{ '%g' | format(sp) }} °C)
  {%- elif now().hour >= 17 -%}
  done for today (after 17:00)
  {%- elif defrost and (defrost.state == 'on'
           or now() - defrost.last_changed < timedelta(minutes=5)) -%}
  paused (defrost)
  {%- elif is_state('binary_sensor.lg_therma_v_r290_compressor', 'off') -%}
  waiting for the compressor
  {%- else -%}
  active
  {%- endif %}
  {% set last = states.input_text.autotemp_status %}
  {%- if last and last.state not in ['unknown', 'unavailable', ''] %}<br>
  {{ last.state }} · {{ relative_time(last.last_changed) }} ago
  {%- endif %}
