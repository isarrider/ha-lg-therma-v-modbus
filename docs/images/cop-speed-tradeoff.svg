<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 422" width="720" height="422" role="img" aria-label="Faster: the compressor gains more than the warmer water costs">
<style>
.bg{fill:#fcfcfb}.t{fill:#0b0b0b;font:600 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.s{fill:#52514e;font:12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.lab{fill:#0b0b0b;font:12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.grid{stroke:#e4e3df;stroke-width:1}.axis{stroke:#9d9c96;stroke-width:1}
.c1{stroke:#2a78d6;fill:#2a78d6}.c2{stroke:#eb6834;fill:#eb6834}.c3{stroke:#1baf7a;fill:#1baf7a}.c4{stroke:#6250d6;fill:#6250d6}.c0{stroke:#9d9c96;fill:#9d9c96}
.band{fill:#2a78d6;fill-opacity:.15;stroke:none}.ln{fill:none!important;stroke-width:2}.dash{stroke-dasharray:5 4}.ring{stroke:#fcfcfb;stroke-width:2}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t,.lab{fill:#f0efec}.s{fill:#c3c2b7}.grid{stroke:#33332f}.axis{stroke:#6d6c66}
