# Full view: a sections dashboard with every entity of the LG Therma V R290
# integration. How to use it, and which cards need which option:
# https://github.com/isarrider/ha-lg-therma-v-modbus/blob/main/docs/dashboard.md#full-view
#
# Settings -> Dashboards -> Add dashboard -> New dashboard from scratch, open it,
# Edit dashboard -> Raw configuration editor, and replace everything with this file.
views:
  - title: Therma V
    path: therma-v
    type: sections
    max_columns: 4
    header:
      layout: responsive
      badges_position: bottom
      badges_wrap: wrap
    badges: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Overview
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.lg_therma_v_r290_heating_cooling
                name: Heating/Cooling
              - entity: sensor.lg_therma_v_r290_operation_mode
          # Quick view. Line 1: error code, fault, water pressure (⚠ below 1.0 bar),
          # flow (⚠ below 10 L/min) and Modbus errors since the start (option: Poll
          # statistics; ⚠ and how long ago while the last one is under an hour old),
          # "defrosting" during a defrost. Line 2: compressor speed, outlet → inlet,
          # outdoor → evaporator coil.
          - type: markdown
            text_only: true
            grid_options:
              rows: auto
            content: >-
              {% set code = states('sensor.lg_therma_v_r290_error_code') %}
              {% set fault = is_state('binary_sensor.lg_therma_v_r290_fault', 'on') %}
              {% set bar = states('sensor.lg_therma_v_r290_water_pressure') | float(none) %}
              {% set flow = states('sensor.lg_therma_v_r290_flow_rate') | float(none) %}
              {% set errors = states('sensor.lg_therma_v_r290_modbus_errors') | int(0) %}
              {% set last = state_attr('sensor.lg_therma_v_r290_last_modbus_error', 'time') | as_datetime(none) %}
              {% set recent = last is not none and now() - last < timedelta(hours=1) %}
              {% macro n(e, d=1) -%}{%- set x = states('sensor.lg_therma_v_r290_' ~ e) -%}{{ '%.*f' | format(d, x | float) if x | is_number else '–' }}{%- endmacro %}
              {{ '⚠ ' if code not in ['0', 'unknown', 'unavailable'] }}<ha-icon icon="mdi:alert-circle-outline"></ha-icon> Error Code {{ code }}
              &nbsp;&nbsp; {% if fault %}⚠ <ha-icon icon="mdi:alert"></ha-icon> Fault{% else %}<ha-icon icon="mdi:check-circle-outline"></ha-icon> No fault{% endif %}
              &nbsp;&nbsp; {{ '⚠ ' if bar is number and bar < 1.0 }}<ha-icon icon="mdi:gauge"></ha-icon> {{ '%.2f' | format(bar) if bar is number else '–' }} bar
              &nbsp;&nbsp; {{ '⚠ ' if flow is number and flow < 10 }}<ha-icon icon="mdi:waves-arrow-right"></ha-icon> {{ flow | round(0) | int if flow is number else '–' }} L/min
              &nbsp;&nbsp; {{ '⚠ ' if recent }}<ha-icon icon="mdi:lan"></ha-icon> {{ errors }}{% if recent %}, last {{ relative_time(last) }} ago{% endif %}
              {%- if is_state('binary_sensor.lg_therma_v_r290_defrost', 'on') %} &nbsp;&nbsp; <ha-icon icon="mdi:snowflake-melt"></ha-icon> defrosting{% endif %}<br>
              <ha-icon icon="mdi:fan"></ha-icon> {{ n('compressor_speed', 0) }} rpm
              &nbsp;&nbsp; <ha-icon icon="mdi:thermometer-water"></ha-icon> {{ n('outlet_temperature') }} → {{ n('inlet_temperature') }} °C
              &nbsp;&nbsp; <ha-icon icon="mdi:sun-thermometer-outline"></ha-icon> {{ n('outdoor_temperature') }} → {{ n('temperature_before_evaporator') }} °C
          - type: history-graph
            entities:
              - entity: sensor.lg_therma_v_r290_inlet_temperature
                name: Inlet
              - entity: sensor.lg_therma_v_r290_outlet_temperature
                name: Outlet
              - entity: sensor.lg_therma_v_r290_temperature_before_evaporator
                name: Evaporator coil
              - entity: sensor.lg_therma_v_r290_room_air_temperature_circuit_1
                name: Technikraum
              - entity: sensor.lg_therma_v_r290_outdoor_temperature
                name: Outdoor
              - entity: sensor.lg_therma_v_r290_compressor_speed
                name: Compressor Speed
              - entity: sensor.lg_therma_v_r290_flow_rate
                name: Flow Rate
              - entity: select.lg_therma_v_r290_control_method
                name: Control Method
              - entity: binary_sensor.lg_therma_v_r290_compressor
                name: Compressor
              - entity: binary_sensor.lg_therma_v_r290_defrost
                name: Defrost
            hours_to_show: 24
            logarithmic_scale: false
      - type: grid
        cards:
          - type: heading
            heading: Control
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.lg_therma_v_r290_compressor_speed
                name: Compressor Speed
              - entity: sensor.lg_therma_v_r290_compressor_average_speed
                name: Compressor Average Speed
              - entity: number.lg_therma_v_r290_max_compressor_modulation
                name: Max Compressor Modulation
              - entity: binary_sensor.lg_therma_v_r290_compressor
                name: Compressor
              - entity: switch.lg_therma_v_r290_silent_mode
                name: Silent Mode
              - entity: binary_sensor.lg_therma_v_r290_silent_mode
                name: Silent mode (status)
              - entity: switch.lg_therma_v_r290_power_limit
                name: Power Limit
              - entity: number.lg_therma_v_r290_max_electrical_power
                name: Max Electrical Power
          # Starts, run time and defrosts: today and in total (option:
          # Compressor statistics; today comes from the sensors' today attribute)
          - type: markdown
            text_only: true
            grid_options:
              rows: auto
            content: |-
              {% set s = 'sensor.lg_therma_v_r290_compressor_starts' %}
              {% set r = 'sensor.lg_therma_v_r290_compressor_run_time' %}
              {% set d = 'sensor.lg_therma_v_r290_defrosts' %}
              {% set t = 'sensor.lg_therma_v_r290_defrost_time' %}
              {% set e = 'sensor.lg_therma_v_r290_defrost_energy' %}
              <table width="100%">
              <tr><td></td><td align="right"><b>Today</b></td><td align="right"><b>Total</b></td></tr>
              <tr><td>Starts</td><td align="right"><b>{{ state_attr(s, 'today') | int(0) }}</b></td><td align="right">{{ states(s) }}</td></tr>
              <tr><td>Run time</td><td align="right"><b>{{ state_attr(r, 'today') | float(0) | round(1) }} h</b></td><td align="right">{{ states(r) | float(0) | round(0) | int }} h</td></tr>
              <tr><td>Defrosts</td><td align="right"><b>{{ state_attr(d, 'today') | int(0) }}</b></td><td align="right">{{ states(d) | int(0) }}</td></tr>
              <tr><td>Defrost time</td><td align="right"><b>{{ state_attr(t, 'today') | float(0) | round(0) | int }} min</b></td><td align="right">{{ states(t) | float(0) | round(0) | int }} min</td></tr>
              <tr><td>Defrost energy</td><td align="right"><b>{{ state_attr(e, 'today') | float(0) | round(2) }} kWh</b></td><td align="right">{{ states(e) | float(0) | round(1) }} kWh</td></tr>
              </table>

              {%- macro dur(m) -%}{%- if m is number -%}{{ (m | round(0) | int) ~ ' min' if m < 120 else '%.1f h' | format(m / 60) }}{%- else -%}–{%- endif -%}{%- endmacro -%}
              {%- macro since(t) -%}{%- set lt = as_local(t) -%}{{ dur((now() - t).total_seconds() / 60) }} ago ({{ lt.strftime('%H:%M') if lt.date() == now().date() else lt.strftime('%d.%m. %H:%M') }}){%- endmacro -%}
              {%- set cs = states.binary_sensor.lg_therma_v_r290_compressor -%}
              {%- set ds = states.binary_sensor.lg_therma_v_r290_defrost -%}
              {%- set run_m = state_attr('sensor.lg_therma_v_r290_compressor_starts', 'last_run_minutes') -%}
              {%- set def_m = state_attr('sensor.lg_therma_v_r290_defrosts', 'last_defrost_minutes') -%}
              <table width="100%">
              <tr><td></td><td align="right"><b>When</b></td><td align="right"><b>Lasted</b></td></tr>
              <tr><td>Last run</td><td align="right">{% if cs and cs.state == 'on' %}running since {{ as_local(cs.last_changed).strftime('%H:%M') }}{% elif cs %}stopped {{ since(cs.last_changed) }}{% else %}–{% endif %}</td><td align="right">{{ dur(run_m) }}</td></tr>
              <tr><td>Last defrost</td><td align="right">{% if ds and ds.state == 'on' %}now{% elif def_m is not number %}none yet{% elif ds %}ended {{ since(ds.last_changed) }}{% else %}–{% endif %}</td><td align="right">{{ dur(def_m) }}</td></tr>
              </table>
          - type: statistics-graph
            title: Starts and defrosts per day
            entities:
              - entity: sensor.lg_therma_v_r290_compressor_starts
                name: Starts
              - entity: sensor.lg_therma_v_r290_defrosts
                name: Defrosts
            period: day
            days_to_show: 14
            chart_type: bar
            stat_types:
              - change
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.lg_therma_v_r290_outdoor_temperature
                name: Outdoor Temperature
              - entity: sensor.lg_therma_v_r290_temperature_before_evaporator
                name: Evaporator Coil
              - entity: sensor.lg_therma_v_r290_suction_temperature
                name: Suction Temperature
              - entity: sensor.lg_therma_v_r290_outlet_temperature
                name: Outlet Temperature
              - entity: sensor.lg_therma_v_r290_inlet_temperature
                name: Inlet Temperature
              - entity: number.lg_therma_v_r290_target_temperature_circuit_1_radiators
                name: Target Temperature Circuit 1 (Radiators)
              - entity: select.lg_therma_v_r290_control_method
                name: Control Method
              - entity: sensor.lg_therma_v_r290_control_method
                name: Control Method
              - entity: select.lg_therma_v_r290_operation_mode
                name: Operation Mode
              - entity: binary_sensor.lg_therma_v_r290_water_flow
                name: Water Flow
              - entity: sensor.lg_therma_v_r290_flow_rate
                name: Flow Rate
      - type: grid
        cards:
          - type: heading
            heading: Status & Diagnostics
            heading_style: title
          - type: history-graph
            entities:
              - entity: sensor.lg_therma_v_r290_electrical_power_heat_pump
                name: Electrical (reads high)
              - entity: sensor.lg_therma_v_r290_thermal_power_reported
                name: Thermal (reported)
              - entity: sensor.lg_therma_v_r290_thermal_power_calculated
                name: Thermal (calculated)
            hours_to_show: 24
            logarithmic_scale: false
          - type: history-graph
            entities:
              - entity: sensor.lg_therma_v_r290_hot_gas_temperature
                name: Hot Gas Temperature
              - entity: sensor.lg_therma_v_r290_liquid_gas_temperature
                name: Liquid Gas Temperature
              - entity: sensor.lg_therma_v_r290_high_pressure_condenser
                name: High Pressure (Condenser)
              - entity: sensor.lg_therma_v_r290_low_pressure_evaporator
                name: Low Pressure (Evaporator)
            hours_to_show: 24
            logarithmic_scale: false
          - type: history-graph
            entities:
              - entity: sensor.lg_therma_v_r290_water_pressure
                name: Water Pressure
            hours_to_show: 168
            logarithmic_scale: false
      - type: grid
        cards:
          - type: heading
            heading: Power & Energy & Efficiency & Misc
            heading_style: title
          - type: statistic
            entity: sensor.lg_therma_v_r290_electrical_energy_total
            name: Electrical today (unit, reads high)
            period:
              calendar:
                period: day
            stat_type: change
            grid_options:
              rows: auto
          - type: statistic
            entity: sensor.lg_therma_v_r290_thermal_energy_space_heating
            name: Heat today (unit)
            period:
              calendar:
                period: day
            stat_type: change
            grid_options:
              rows: auto
          # Now, today and total: power, energy and the three COPs (option: Energy
          # registers). Today is the counters' today_kwh attribute (2.3.1+).
          - type: markdown
            text_only: true
            grid_options:
              rows: auto
            content: |-
              {% macro v(e, digits=2, scale=1) -%}
              {%- set x = states('sensor.lg_therma_v_r290_' ~ e) -%}
              {{ '%.*f' | format(digits, (x | float) / scale) if x | is_number else '–' }}
              {%- endmacro %}
              {% macro d(e) -%}
              {%- set x = state_attr('sensor.lg_therma_v_r290_' ~ e, 'today_kwh') -%}
              {{ '%.1f' | format(x) if x is number else '–' }}
              {%- endmacro %}
              {% set et = state_attr('sensor.lg_therma_v_r290_electrical_energy_space_heating', 'today_kwh') %}
              {% set ht = state_attr('sensor.lg_therma_v_r290_thermal_energy_space_heating', 'today_kwh') %}
              <table width="100%">
              <tr><td></td><td align="right"><b>Now</b></td><td align="right"><b>Today</b></td><td align="right"><b>Total</b></td></tr>
              <tr><td>Electrical</td><td align="right"><b>{{ v('electrical_power_total_system', 2, 1000) }} kW</b></td><td align="right">{{ d('electrical_energy_space_heating') }} kWh</td><td align="right">{{ v('electrical_energy_space_heating', 0) }} kWh</td></tr>
              <tr><td>Heat</td><td align="right"><b>{{ v('thermal_power_heating_circuit_calculated', 2, 1000) }} kW</b></td><td align="right">{{ d('thermal_energy_space_heating') }} kWh</td><td align="right">{{ v('thermal_energy_space_heating', 0) }} kWh</td></tr>
              <tr><td>COP (flow / rep / sys)</td><td align="right"><b>{{ v('cop_calculated') }} / {{ v('cop_reported') }} / {{ v('cop_system_reported') }}</b></td><td align="right">{{ '%.2f' | format(ht / et) if et is number and ht is number and et > 0 else '–' }}</td><td align="right">{{ v('cop_heating_cumulative') }}</td></tr>
              </table>
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: true
            forecast_type: daily
            round_temperature: false
            forecast_slots: 5
          - type: markdown
            text_only: true
            grid_options:
              rows: auto
            content: >-
              <center>
              {% macro t(e) -%}
              {%- set d = states(e) | as_datetime(None) -%}
              {{ (d | as_local).strftime('%H:%M') if d else '–' }}
              {%- endmacro %}
              {% set rise = states('sensor.sun_next_rising') | as_datetime(None) %}
              {% set sset = states('sensor.sun_next_setting') | as_datetime(None) %}
              <ha-icon icon="mdi:weather-sunset-up"></ha-icon>
              {{ t('sensor.sun_next_dawn') }}
              &nbsp;&nbsp;
              <ha-icon icon="mdi:weather-sunny"></ha-icon>
              {{ t('sensor.sun_next_rising') }}
              &nbsp;&nbsp;
              <ha-icon icon="mdi:sun-clock"></ha-icon>
              {{ t('sensor.sun_next_noon') }}
              &nbsp;&nbsp;
              <ha-icon icon="mdi:timer-sand"></ha-icon>
              {% if rise and sset %}
              {% set m = ((sset - rise).total_seconds() // 60) % 1440 %}
              {{ '%d:%02d h' | format(m // 60, m % 60) }}
              {% else %}–{% endif %}
              &nbsp;&nbsp;
              <ha-icon icon="mdi:weather-sunset-down"></ha-icon>
              {{ t('sensor.sun_next_setting') }}
              &nbsp;&nbsp;
              <ha-icon icon="mdi:weather-night"></ha-icon>
              {{ t('sensor.sun_next_dusk') }}
              </center>
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.lg_therma_v_r290_poll_duration
              - entity: sensor.lg_therma_v_r290_bus_load
              - entity: sensor.lg_therma_v_r290_modbus_errors
              - entity: sensor.lg_therma_v_r290_last_modbus_error
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.lg_therma_v_r290_last_modbus_error
                    state_not: none
                row:
                  time_format: relative
                  type: attribute
                  entity: sensor.lg_therma_v_r290_last_modbus_error
                  attribute: time
                  name: Last error at
                  icon: mdi:history
              - time_format: relative
                type: attribute
                entity: sensor.lg_therma_v_r290_last_modbus_error
                attribute: since
                name: Counting since
                icon: mdi:timer-play-outline
          # Electrical and space heating energy per day (option: Energy registers)
          - type: statistics-graph
            title: Energy per day
            entities:
              - entity: sensor.lg_therma_v_r290_electrical_energy_total
                name: Electrical
              - entity: sensor.lg_therma_v_r290_thermal_energy_space_heating
                name: Space heating
            days_to_show: 7
            period: day
            chart_type: bar
            stat_types:
              - change
      - type: grid
        cards:
          - type: heading
            heading: Rarely used
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_external_water_pump
            name: External Water Pump
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_mixing_pump
            name: Mixing Pump
          - type: tile
            entity: sensor.lg_therma_v_r290_flow_temperature_circuit_2
            name: Flow Temperature Circuit 2
          - type: tile
            entity: number.lg_therma_v_r290_target_temperature_circuit_2_underfloor
            name: Target Temperature Circuit 2 (Underfloor)
          - type: tile
            entity: number.lg_therma_v_r290_setpoint_shift_circuit_1
            name: Setpoint Shift Circuit 1
          - type: tile
            entity: number.lg_therma_v_r290_setpoint_shift_circuit_2
            name: Setpoint Shift Circuit 2
          - type: tile
            entity: sensor.lg_therma_v_r290_room_air_temperature_circuit_2
            name: Room Air Temperature Circuit 2
          - type: tile
            entity: sensor.lg_therma_v_r290_target_room_air_temperature_circuit_1
            name: Target Room Air Temperature Circuit 1
          - type: tile
            entity: sensor.lg_therma_v_r290_target_room_air_temperature_circuit_2
            name: Target Room Air Temperature Circuit 2
          - type: tile
            entity: sensor.lg_therma_v_r290_product_information
          - type: tile
            entity: sensor.lg_therma_v_r290_device_group
            name: Device Group
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_backup_heater_step_1
            name: Backup Heater Step 1
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_backup_heater_step_2
            name: Backup Heater Step 2
          - type: tile
            entity: sensor.lg_therma_v_r290_backup_heater_outlet_temperature
            name: Backup Heater Outlet Temperature
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_cooling_active
            name: Cooling active (unreliable)
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_solar_pump
            name: Solar Pump
          - type: tile
            entity: sensor.lg_therma_v_r290_solar_collector_temperature
            name: Solar Collector Temperature
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_emergency_heating_cooling_available
          - type: tile
            entity: sensor.lg_therma_v_r290_electrical_energy_space_cooling
      - type: grid
        cards:
          - type: heading
            heading: Energy state (holding 9)
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.lg_therma_v_r290_energy_state
                name: Energy state (holding 9, command)
              - entity: sensor.lg_therma_v_r290_energy_state_reported
                name: Energy state (input 11, reported)
              - entity: sensor.lg_therma_v_r290_energy_control_signal
                name: Energy Control Signal
          - type: glance
            columns: 3
            state_color: true
            show_state: false
            entities:
              - entity: binary_sensor.lg_therma_v_r290_energy_state_not_used
                name: Not used
              - entity: binary_sensor.lg_therma_v_r290_energy_state_forced_off
                name: Forced off
              - entity: binary_sensor.lg_therma_v_r290_energy_state_normal_operation
                name: Normal
              - entity: binary_sensor.lg_therma_v_r290_energy_state_on_recommendation
                name: On recommend.
              - entity: binary_sensor.lg_therma_v_r290_energy_state_on_command
                name: On command
              - entity: binary_sensor.lg_therma_v_r290_energy_state_on_command_step_2
                name: On cmd step 2
              - entity: binary_sensor.lg_therma_v_r290_energy_state_on_recommendation_step_1
                name: On rec. step 1
              - entity: binary_sensor.lg_therma_v_r290_energy_state_energy_saving_mode
                name: Saving
              - entity: binary_sensor.lg_therma_v_r290_energy_state_super_energy_saving_mode
                name: Super saving
      - type: grid
        cards:
          - type: heading
            heading: DHW (unused)
          - type: tile
            entity: switch.lg_therma_v_r290_dhw
            name: DHW
          - type: tile
            entity: number.lg_therma_v_r290_dhw_target_temperature
            name: DHW Target Temperature
          - type: tile
            entity: sensor.lg_therma_v_r290_dhw_temperature
            name: DHW Temperature
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_dhw_heating
            name: DHW Heating
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_dhw_boost_heater
            name: DHW Boost Heater
          - type: tile
            entity: button.lg_therma_v_r290_start_disinfection
            name: Start Disinfection
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_dhw_disinfection
            name: DHW Disinfection
          - type: tile
            entity: sensor.lg_therma_v_r290_electrical_energy_dhw
            name: Electrical Energy DHW
          - type: tile
            entity: sensor.lg_therma_v_r290_thermal_power_dhw_calculated
            name: Thermal Power DHW (Calculated)
          - type: tile
            entity: binary_sensor.lg_therma_v_r290_emergency_dhw_available
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.lg_therma_v_r290_operation_state_odu
              - entity: sensor.lg_therma_v_r290_operation_cycle_odu
              - entity: sensor.lg_therma_v_r290_demand_vs_supply
            title: Misc
      - type: grid
        cards:
          - type: heading
            heading: Experimental registers
          - color: none
            type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.lg_therma_v_r290_optional_registers
              - entity: sensor.lg_therma_v_r290_experimental_input_30015
                name: Experimental Input 30015
              - entity: sensor.lg_therma_v_r290_experimental_input_30018
                name: Experimental Input 30018
              - entity: sensor.lg_therma_v_r290_experimental_input_30064
                name: Experimental Input 30064
              - entity: sensor.lg_therma_v_r290_experimental_holding_40011
                name: Experimental Holding 40011
              - entity: sensor.lg_therma_v_r290_experimental_holding_40012
                name: Experimental Holding 40012
              - entity: sensor.lg_therma_v_r290_experimental_holding_40013
                name: Experimental Holding 40013
              - entity: sensor.lg_therma_v_r290_experimental_holding_40014
                name: Experimental Holding 40014
              - entity: sensor.lg_therma_v_r290_experimental_holding_40015
                name: Experimental Holding 40015
              - entity: sensor.lg_therma_v_r290_experimental_holding_40016
                name: Experimental Holding 40016
              - entity: sensor.lg_therma_v_r290_experimental_holding_40017
                name: Experimental Holding 40017
              - entity: sensor.lg_therma_v_r290_experimental_holding_40018
                name: Experimental Holding 40018
              - entity: sensor.lg_therma_v_r290_experimental_holding_40019
                name: Experimental Holding 40019
              - entity: sensor.lg_therma_v_r290_experimental_holding_40020
                name: Experimental Holding 40020
              - entity: sensor.lg_therma_v_r290_experimental_holding_40021
                name: Experimental Holding 40021
